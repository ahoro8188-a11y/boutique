<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Wren &amp; Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Poppins:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ NAV ============ -->
<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">Wren &amp; Co.</a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="is-current">Contact</a>
    </nav>
    <div class="nav-icons">
      <span aria-hidden="true">🔍</span>
      <span aria-hidden="true">🛍️</span>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ============ PAGE BANNER ============ -->
<section class="page-banner">
  <p class="script-tag">say hello</p>
  <h1>Get In Touch</h1>
</section>

<!-- ============ CONTACT ============ -->
<section class="contact-page">
  <div class="contact-info">
    <p class="script-tag">visit us</p>
    <h2>We'd love to see you<br>in the shop</h2>
    <p class="contact-detail">📍 118 Birchwood Lane, Asheville, NC</p>
    <p class="contact-detail">✉️ hello@wrenandco.com</p>
    <p class="contact-detail">📞 (828) 555-0173</p>
    <p class="contact-hours">Wed–Sun, 11am–6pm</p>
  </div>

  <form class="contact-form" id="contactForm">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <textarea name="message" placeholder="Your message" rows="4" required></textarea>
    <button type="submit" class="btn btn-primary">Send message</button>
    <p class="form-note" id="formNote" aria-live="polite"></p>
  </form>
</section>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="footer-bottom">
    <p>© 2026 Wren &amp; Co.</p>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
